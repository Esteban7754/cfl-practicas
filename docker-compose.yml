# Tres formas de ejecutar la misma imagen (los lanzadores run.ps1 / run.bat las usan):
#
#   docker compose run --rm cfl comparar --seeds 42 43 44     # código congelado en la imagen
#   docker compose run --rm dev tests                         # tu copia del código, para desarrollar
#   docker compose --profile gpu run --rm gpu comparar        # GPU NVIDIA (opcional)
#
# Los resultados quedan siempre en ./resultados. CIFAR-100 viene dentro de la imagen y se
# copia al volumen cfl-datos la primera vez; DomainNet se descarga ahí y se conserva.

x-base: &base
  image: cfl-practicas:cpu
  build:
    context: ${CFL_CONTEXTO:-.}
    args:
      TORCH_VARIANT: cpu
      CFL_REVISION: ${CFL_REVISION:-desconocida}
      BUILD_DATE: ${BUILD_DATE:-desconocida}
  environment:
    - TZ=${TZ:-Europe/Madrid}
    - OMP_NUM_THREADS
    - MKL_NUM_THREADS
    - HF_HUB_OFFLINE
    - HF_DATASETS_OFFLINE
  init: true

services:
  cfl:
    <<: *base
    volumes:
      - ./resultados:/app/resultados
      - ./data:/app/data:ro
      - cfl-datos:/opt/hf-cache

  dev:
    <<: *base
    volumes:
      - .:/app
      - cfl-datos:/opt/hf-cache

  gpu:
    <<: *base
    profiles: ["gpu"]
    image: cfl-practicas:gpu
    build:
      context: ${CFL_CONTEXTO:-.}
      args:
        TORCH_VARIANT: cuda
        CFL_REVISION: ${CFL_REVISION:-desconocida}
        BUILD_DATE: ${BUILD_DATE:-desconocida}
    volumes:
      - ./resultados:/app/resultados
      - ./data:/app/data:ro
      - cfl-datos:/opt/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  cfl-datos:
    name: cfl-datos
